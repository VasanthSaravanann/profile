name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install native binaries for the runner platform
        # The lockfile (generated on macOS) omits the linux-x64 variants of
        # rollup's and tailwind-oxide's optional deps, so npm ci can't place
        # them. Install them explicitly, but derive every version from the
        # lockfile so they can never drift from the resolved JS packages.
        run: |
          ROLLUP_VER=$(node -p "require('./package-lock.json').packages['node_modules/rollup'].version")
          OXIDE_VER=$(node -p "require('./package-lock.json').packages['node_modules/@tailwindcss/oxide'].version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VER}" "@tailwindcss/oxide-linux-x64-gnu@${OXIDE_VER}"

      - name: Build site
        run: npm run build

      - name: Disable Jekyll
        run: touch dist/client/.nojekyll

      - name: Copy CNAME for custom domain
        run: cp CNAME dist/client/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4